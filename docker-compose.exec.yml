# docker-compose.exec.yml
# リポジトリ外の任意のディレクトリでエージェントシステムを実行するための設定です。
#
# 【使い方】
# 1. リポジトリでイメージをビルド: docker build -t orchestragent:latest .
#    または Docker Hub などから image を利用する場合は ORCHESTRAGENT_IMAGE を設定
# 2. 作業したいプロジェクトのディレクトリに移動: cd /path/to/your/project
# 3. 起動（.env を使う場合は --env-file を推奨）:
#    docker-compose -f /path/to/orchestragent/docker-compose.exec.yml --env-file .env up -d
#    カレントディレクトリが「作業対象プロジェクト」として /target にマウントされます。
#
# 【state / logs / docs/adr の保存先】
# コンテナ内では常に /workspace/state, /workspace/logs, /workspace/docs/adr を使用します。
# ホスト側のパスは ORCHESTRAGENT_STATE_DIR / ORCHESTRAGENT_LOG_DIR / ORCHESTRAGENT_ADR_DIR で指定します。
# Compose v2 で -f を使うと相対パスは compose ファイルのあるディレクトリ基準になるため、
# リポジトリ外で実行する場合は絶対パス指定を推奨します（例: .env に記載）:
#   ORCHESTRAGENT_STATE_DIR=/path/to/your/project/state
#   ORCHESTRAGENT_LOG_DIR=/path/to/your/project/logs
#   ORCHESTRAGENT_ADR_DIR=/path/to/your/project/docs/adr
#
# 【.env について】Compose の v1 / v2 や -f の有無で .env の読み込み場所が異なります。
# 確実に読み込ませるため、--env-file .env の指定を推奨します（.env が無い場合は省略可）。
#
# 【開発用】リポジトリ内で開発する場合は docker-compose.yml を使用してください。

services:
  agent:
    image: ${ORCHESTRAGENT_IMAGE:-orchestragent:latest}
    volumes:
      # 作業対象のプロジェクトディレクトリをマウント（実行時のカレントディレクトリ）
      - ${TARGET_PROJECT:-.}:/target
      # 状態ファイルを永続化（ホスト側は絶対パス指定可。コンテナ内は常に /workspace/state, /workspace/logs, /workspace/docs/adr）
      - ${ORCHESTRAGENT_STATE_DIR:-./state}:/workspace/state
      - ${ORCHESTRAGENT_LOG_DIR:-./logs}:/workspace/logs
      - ${ORCHESTRAGENT_ADR_DIR:-./docs/adr}:/workspace/docs/adr
      # Cursor CLIの認証情報を永続化（重要）
      - cursor-config:/root/.cursor
      - cursor-config-config:/root/.config/cursor
    environment:
      - PROJECT_ROOT=${PROJECT_ROOT:-/target}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROJECT_GOAL=${PROJECT_GOAL:-プロジェクトの目標を設定してください}
      - DASHBOARD=${DASHBOARD:-false}
      - LLM_BACKEND=${LLM_BACKEND:-cursor_cli}
      - LLM_OUTPUT_FORMAT=${LLM_OUTPUT_FORMAT:-text}
      - LLM_MODEL=${LLM_MODEL:-}
      - PLANNER_MODEL=${PLANNER_MODEL:-}
      - WORKER_MODEL=${WORKER_MODEL:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-}
      - WORKER_MODEL_LIGHT=${WORKER_MODEL_LIGHT:-}
      - WORKER_MODEL_STANDARD=${WORKER_MODEL_STANDARD:-}
      - WORKER_MODEL_POWERFUL=${WORKER_MODEL_POWERFUL:-}
      - MODEL_SELECTION_ENABLED=${MODEL_SELECTION_ENABLED:-false}
      - MODEL_COMPLEXITY_THRESHOLD_LIGHT=${MODEL_COMPLEXITY_THRESHOLD_LIGHT:-10.0}
      - MODEL_COMPLEXITY_THRESHOLD_POWERFUL=${MODEL_COMPLEXITY_THRESHOLD_POWERFUL:-30.0}
      - WAIT_TIME_SECONDS=${WAIT_TIME_SECONDS:-60}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-100}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-3}
      - ENABLE_PARALLEL_EXECUTION=${ENABLE_PARALLEL_EXECUTION:-true}
      # ダッシュボード設定タブでホスト側パスを表示するため
      - HOST_STATE_DIR=${ORCHESTRAGENT_STATE_DIR:-./state}
      - HOST_LOG_DIR=${ORCHESTRAGENT_LOG_DIR:-./logs}
      - HOST_ADR_DIR=${ORCHESTRAGENT_ADR_DIR:-./docs/adr}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    working_dir: /workspace
    network_mode: bridge
    restart: unless-stopped
    stdin_open: true
    tty: true

  web-dashboard:
    image: ${ORCHESTRAGENT_IMAGE:-orchestragent:latest}
    command: python -m orchestragent.dashboard.web
    volumes:
      - ${TARGET_PROJECT:-.}:/target
      - ${ORCHESTRAGENT_STATE_DIR:-./state}:/workspace/state
      - ${ORCHESTRAGENT_LOG_DIR:-./logs}:/workspace/logs
      - ${ORCHESTRAGENT_ADR_DIR:-./docs/adr}:/workspace/docs/adr
    environment:
      - PYTHONPATH=/workspace/src
      - PROJECT_ROOT=${PROJECT_ROOT:-/target}
      - TARGET_PROJECT=${TARGET_PROJECT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROJECT_GOAL=${PROJECT_GOAL:-プロジェクトの目標を設定してください}
      # ダッシュボード設定タブでホスト側パスを表示するため
      - HOST_STATE_DIR=${ORCHESTRAGENT_STATE_DIR:-./state}
      - HOST_LOG_DIR=${ORCHESTRAGENT_LOG_DIR:-./logs}
      - HOST_ADR_DIR=${ORCHESTRAGENT_ADR_DIR:-./docs/adr}
      - LLM_BACKEND=${LLM_BACKEND:-cursor_cli}
      - LLM_OUTPUT_FORMAT=${LLM_OUTPUT_FORMAT:-text}
      - LLM_MODEL=${LLM_MODEL:-}
      - PLANNER_MODEL=${PLANNER_MODEL:-}
      - WORKER_MODEL=${WORKER_MODEL:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-}
      - WORKER_MODEL_LIGHT=${WORKER_MODEL_LIGHT:-}
      - WORKER_MODEL_STANDARD=${WORKER_MODEL_STANDARD:-}
      - WORKER_MODEL_POWERFUL=${WORKER_MODEL_POWERFUL:-}
      - MODEL_SELECTION_ENABLED=${MODEL_SELECTION_ENABLED:-false}
      - MODEL_COMPLEXITY_THRESHOLD_LIGHT=${MODEL_COMPLEXITY_THRESHOLD_LIGHT:-10.0}
      - MODEL_COMPLEXITY_THRESHOLD_POWERFUL=${MODEL_COMPLEXITY_THRESHOLD_POWERFUL:-30.0}
      - WAIT_TIME_SECONDS=${WAIT_TIME_SECONDS:-60}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-100}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-3}
      - ENABLE_PARALLEL_EXECUTION=${ENABLE_PARALLEL_EXECUTION:-true}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - WEB_DASHBOARD_PORT=8765
      - WEB_DASHBOARD_HOST=0.0.0.0
    working_dir: /workspace
    ports:
      - "8765:8765"
    restart: unless-stopped

volumes:
  cursor-config:
  cursor-config-config:
