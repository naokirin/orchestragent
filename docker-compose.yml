# Development: run with the repository as current directory.
# .env loading differs between Compose v1/v2; to load explicitly use:
#   docker compose --env-file .env up
#   docker-compose -f docker-compose.yml --env-file .env up

services:
  agent:
    # Build locally
    build:
      context: .
      dockerfile: Dockerfile
    # To use image from Docker Hub, uncomment the line below and comment out build:
    # image: your-username/cursor-scage:latest
    volumes:
      # Mount agent system code
      - .:/workspace
      # Mount target project directory (TARGET_PROJECT env; default: current directory)
      - ${TARGET_PROJECT:-.}:/target
      # Persist state files (container paths: /workspace/state, /workspace/logs)
      - ./state:/workspace/state
      - ./logs:/workspace/logs
      # Persist ADR (container path: /workspace/docs/adr)
      - ./docs/adr:/workspace/docs/adr
      # Persist Cursor CLI auth (stored in /root/.cursor and /root/.config/cursor)
      - cursor-config:/root/.cursor
      - cursor-config-config:/root/.config/cursor
    environment:
      # Target project root (/target if TARGET_PROJECT set, else /workspace)
      - PROJECT_ROOT=${PROJECT_ROOT:-/target}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROJECT_GOAL=${PROJECT_GOAL:-プロジェクトの目標を設定してください}
      # Dashboard mode (true/1/on to enable)
      - DASHBOARD=${DASHBOARD:-false}
      # Load env from .env file
      - LLM_BACKEND=${LLM_BACKEND:-cursor_cli}
      - LLM_OUTPUT_FORMAT=${LLM_OUTPUT_FORMAT:-text}
      - LLM_MODEL=${LLM_MODEL:-}
      # Agent-specific model configuration
      - PLANNER_MODEL=${PLANNER_MODEL:-}
      - WORKER_MODEL=${WORKER_MODEL:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-}
      # Dynamic model selection for workers
      - WORKER_MODEL_LIGHT=${WORKER_MODEL_LIGHT:-}
      - WORKER_MODEL_STANDARD=${WORKER_MODEL_STANDARD:-}
      - WORKER_MODEL_POWERFUL=${WORKER_MODEL_POWERFUL:-}
      # Model selection configuration
      - MODEL_SELECTION_ENABLED=${MODEL_SELECTION_ENABLED:-false}
      - MODEL_COMPLEXITY_THRESHOLD_LIGHT=${MODEL_COMPLEXITY_THRESHOLD_LIGHT:-10.0}
      - MODEL_COMPLEXITY_THRESHOLD_POWERFUL=${MODEL_COMPLEXITY_THRESHOLD_POWERFUL:-30.0}
      - WAIT_TIME_SECONDS=${WAIT_TIME_SECONDS:-60}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-100}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-3}
      - ENABLE_PARALLEL_EXECUTION=${ENABLE_PARALLEL_EXECUTION:-true}
      # For dashboard settings tab (host paths; default ${PWD}/state etc.)
      - HOST_STATE_DIR=${HOST_STATE_DIR:-${PWD}/state}
      - HOST_LOG_DIR=${HOST_LOG_DIR:-${PWD}/logs}
      - HOST_ADR_DIR=${HOST_ADR_DIR:-${PWD}/docs/adr}
      # Git configuration used by agents inside the container
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    working_dir: /workspace
    # Allow network access (for API calls)
    network_mode: bridge
    # Allow long-running execution
    restart: unless-stopped
    # Interactive mode (for initial auth)
    stdin_open: true
    tty: true

  # Web dashboard (does not run main.py; only reads state/logs). Env vars aligned with agent for settings tab.
  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # When using Docker Hub: image: your-username/cursor-scage:latest
    command: python -m orchestragent.dashboard.web
    volumes:
      - .:/workspace
      - ${TARGET_PROJECT:-.}:/target
      - ./state:/workspace/state
      - ./logs:/workspace/logs
      - ./docs/adr:/workspace/docs/adr
    environment:
      # orchestragent lives under src/; set PYTHONPATH for python -m
      - PYTHONPATH=/workspace/src
      - PROJECT_ROOT=${PROJECT_ROOT:-/target}
      - TARGET_PROJECT=${TARGET_PROJECT:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROJECT_GOAL=${PROJECT_GOAL:-プロジェクトの目標を設定してください}
      - LLM_BACKEND=${LLM_BACKEND:-cursor_cli}
      - LLM_OUTPUT_FORMAT=${LLM_OUTPUT_FORMAT:-text}
      - LLM_MODEL=${LLM_MODEL:-}
      - PLANNER_MODEL=${PLANNER_MODEL:-}
      - WORKER_MODEL=${WORKER_MODEL:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-}
      - WORKER_MODEL_LIGHT=${WORKER_MODEL_LIGHT:-}
      - WORKER_MODEL_STANDARD=${WORKER_MODEL_STANDARD:-}
      - WORKER_MODEL_POWERFUL=${WORKER_MODEL_POWERFUL:-}
      - MODEL_SELECTION_ENABLED=${MODEL_SELECTION_ENABLED:-false}
      - MODEL_COMPLEXITY_THRESHOLD_LIGHT=${MODEL_COMPLEXITY_THRESHOLD_LIGHT:-10.0}
      - MODEL_COMPLEXITY_THRESHOLD_POWERFUL=${MODEL_COMPLEXITY_THRESHOLD_POWERFUL:-30.0}
      - WAIT_TIME_SECONDS=${WAIT_TIME_SECONDS:-60}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-100}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-3}
      - ENABLE_PARALLEL_EXECUTION=${ENABLE_PARALLEL_EXECUTION:-true}
      # For dashboard settings tab (host paths)
      - HOST_STATE_DIR=${HOST_STATE_DIR:-${PWD}/state}
      - HOST_LOG_DIR=${HOST_LOG_DIR:-${PWD}/logs}
      - HOST_ADR_DIR=${HOST_ADR_DIR:-${PWD}/docs/adr}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - WEB_DASHBOARD_PORT=8765
      - WEB_DASHBOARD_HOST=0.0.0.0
    working_dir: /workspace
    ports:
      - "8765:8765"
    restart: unless-stopped

volumes:
  cursor-config:
    # Persist Cursor CLI auth (/root/.cursor)
  cursor-config-config:
    # Persist Cursor CLI auth (/root/.config/cursor)
